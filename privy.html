<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>司憲院制司受憲秘閣院職官表</title>
<style>
:root{
    --privy-purple:#4b0082;
    --privy-gold:#d4af37;
    --privy-border:#a2a9b1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
    background:#f5f5f5;
    color:#202122;
    font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
}
#privy-app{
    max-width:1000px;
    margin:20px auto;
    font-family:inherit;
    color:#202122;
    background:#fff;
    border:1px solid var(--privy-border);
    padding:25px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    line-height:1.6;
    position:relative;
}
#privy-edit-trigger{
    position:absolute;
    top:25px;
    right:25px;
    cursor:pointer;
    font-size:18px;
    color:#eee;
    transition:color .3s;
    z-index:999;
}
#privy-edit-trigger:hover{color:var(--privy-purple)}
#privy-header-area{
    border-bottom:3px solid var(--privy-purple);
    margin-bottom:20px;
    padding-bottom:10px;
    padding-right:35px;
}
#privy-header-area h2{
    margin:0;
    color:#000;
    font-size:30px;
    font-weight:bold;
    letter-spacing:2px;
}
#privy-header-area .subtitle{
    font-size:14px;
    color:#54595d;
    font-style:italic;
    margin-top:5px;
}

/* 與內閣共用同一套表格結構 */
#privy-app .wm-wiki-table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:30px;
    border:1px solid var(--privy-border);
    table-layout:fixed;
}
#privy-app .wm-wiki-table th{
    background:#f8f9fa;
    border:1px solid var(--privy-border);
    padding:12px 8px;
    text-align:center;
    font-weight:bold;
    color:#000;
}
#privy-app .wm-wiki-table td{
    border:1px solid var(--privy-border);
    padding:10px 8px;
    vertical-align:middle;
}

/* 司憲院紫色部門橫幅 */
#privy-app .wm-dept-banner,
#privy-app .wm-privy-banner{
    background:var(--privy-purple)!important;
    color:#fff!important;
    font-size:16px!important;
    font-weight:bold;
    text-align:left!important;
    padding-left:15px!important;
    letter-spacing:1px;
}

/* 官員名稱 */
#privy-app .wm-incumbent,
#privy-app .name-field{
    font-weight:900!important;
    color:#000!important;
    font-size:16px!important;
    text-align:left!important;
    padding-left:15px!important;
    min-height:1.2em;
}
#privy-app .name-field.empty-vacancy:after{
    content:"懸缺";
    color:#bdc3c7!important;
    font-style:italic!important;
    font-weight:normal!important;
}

/* 肖像 */
#privy-app .wm-portrait-box{
    width:80px;
    height:100px;
    background:#faf9f6;
    border:1px solid var(--privy-gold);
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-radius:4px;
    position:relative;
}
#privy-app .wm-portrait-box.editable{cursor:pointer}
#privy-app .wm-portrait-img{
    width:100%;
    height:100%;
    object-fit:cover;
}
#privy-app .wm-portrait-placeholder{
    font-size:11px;
    color:#888;
    text-align:center;
}

/* 職等標籤：保留司憲院紫金色 */
#privy-app .wm-rank-tag,
#privy-app .wm-p-rank{
    display:inline-block;
    padding:2px 10px;
    background:#fcf3cf;
    color:#9a7d0a;
    border-radius:4px;
    font-size:12px;
    font-weight:bold;
    border:1px solid var(--privy-gold);
}
#privy-app .wm-rank-high,
#privy-app .wm-p-rank-high{
    background:var(--privy-purple)!important;
    color:#f1c40f!important;
    border:1px solid var(--privy-gold)!important;
}
#privy-app .wm-rank-subchief{
    background:#829cc9!important;
    color:#fff!important;
    border:1px solid #7189b1;
}
#privy-app .wm-rank-adjunct{
    background:#f1f5f9;
    color:#64748b;
    border:1px solid #e2e8f0;
}

/* 編輯狀態 */
#privy-app.is-editing [contenteditable="true"]{
    outline:2px dashed var(--privy-purple)!important;
    background:#fff8dc!important;
    cursor:text;
}
#privy-app.is-editing .wm-portrait-box{
    cursor:pointer;
}

/* 頁尾與同步燈號 */
#privy-app .wm-sync-footer{
    font-size:12px;
    color:#72777d;
    font-style:italic;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    border-left:3px solid var(--privy-gold);
    padding:2px 0 2px 12px;
    margin-top:15px;
    line-height:1.5;
}
#privy-app #privy-sync-status{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-style:normal;
    font-weight:bold;
    white-space:nowrap;
}
#privy-app #privy-sync-status:before{
    content:"";
    width:9px;
    height:9px;
    border-radius:50%;
    background:currentColor;
}
#privy-app #privy-sync-status.online{color:#27ae60!important}
#privy-app #privy-sync-status.online:before{
    animation:privy-green-breathe 1.8s ease-in-out infinite;
    box-shadow:0 0 5px currentColor;
}
#privy-app #privy-sync-status.loading{color:#d4af37!important}
#privy-app #privy-sync-status.error{color:#e74c3c!important}
#privy-app #privy-sync-status.local{color:#7f8c8d!important}
@keyframes privy-green-breathe{
    0%,100%{opacity:.55;box-shadow:0 0 4px currentColor,0 0 8px rgba(39,174,96,.25)}
    50%{opacity:1;box-shadow:0 0 8px currentColor,0 0 18px rgba(39,174,96,.6)}
}


#privy-app .privy-edit-tools{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    margin:-8px 0 16px;
    border:1px solid #d4af37;
    background:#fbf8ff;
    color:#4b0082;
    font-size:13px;
}
#privy-app .privy-edit-tools[hidden]{display:none!important}
#privy-app .privy-edit-tools button{
    border:1px solid #4b0082;
    border-radius:4px;
    padding:6px 12px;
    margin-left:6px;
    background:#4b0082;
    color:#fff;
    cursor:pointer;
    font:inherit;
}
#privy-app .privy-edit-tools button:last-child{
    background:#fff;
    color:#4b0082;
}
#privy-app .privy-edit-tools button:disabled{
    opacity:.55;
    cursor:wait;
}
.privy-auth-modal{
    position:fixed;
    inset:0;
    z-index:100000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(0,0,0,.48);
}
.privy-auth-modal[hidden]{display:none!important}
.privy-auth-card{
    width:min(440px,100%);
    padding:22px;
    border:1px solid #a2a9b1;
    border-top:4px solid #4b0082;
    border-radius:6px;
    background:#fff;
    box-shadow:0 12px 40px rgba(0,0,0,.25);
    font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
}
.privy-auth-title{
    margin-bottom:16px;
    color:#4b0082;
    font-size:19px;
    font-weight:bold;
}
.privy-auth-label{
    display:block;
    margin:12px 0 5px;
    font-size:13px;
    font-weight:bold;
}
.privy-auth-input{
    display:block;
    width:100%;
    padding:10px;
    border:1px solid #a2a9b1;
    border-radius:4px;
    font:inherit;
}
.privy-auth-help{
    margin-top:10px;
    color:#666;
    font-size:12px;
    line-height:1.55;
}
.privy-auth-error{
    min-height:20px;
    margin-top:8px;
    color:#c0392b;
    font-size:12px;
}
.privy-auth-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:12px;
}
.privy-auth-actions button{
    border:1px solid #4b0082;
    border-radius:4px;
    padding:8px 13px;
    background:#fff;
    color:#4b0082;
    cursor:pointer;
    font:inherit;
}
.privy-auth-actions button:last-child{
    background:#4b0082;
    color:#fff;
}
.privy-auth-actions button:disabled{opacity:.55;cursor:wait}

@media(max-width:700px){
    #privy-app{
        margin:0;
        padding:15px;
        box-shadow:none;
    }
    #privy-header-area h2{font-size:23px}
    #privy-app .wm-wiki-table{
        font-size:14px;
        min-width:760px;
    }
    #privy-app .table-scroll{
        overflow-x:auto;
        -webkit-overflow-scrolling:touch;
    }
    #privy-app .wm-portrait-box{
        width:64px;
        height:80px;
    }
    #privy-app .wm-sync-footer{
        align-items:flex-start;
        flex-direction:column;
    }
}
</style>
</head>
<body>
<main class="wm-wiki-wrapper" id="privy-app">
    <div id="privy-edit-trigger" title="管理員編輯">⚙️</div>

    <div id="privy-header-area">
        <h2 class="editable-field">司憲院制司受憲秘閣院職官表</h2>
        <div class="subtitle editable-field">Privy Council — List of Imperial Secretarial Officials</div>
    </div>

    <div class="privy-edit-tools" id="privy-edit-tools" hidden>
        <span>編輯模式：修改完成後提交至 GitHub</span>
        <div>
            <button type="button" id="privy-save-button">提交至 GitHub</button>
            <button type="button" id="privy-cancel-button">取消修改</button>
        </div>
    </div>

    <div class="table-scroll">
        <table class="wm-wiki-table">
            <thead>
                <tr>
                    <th style="width:100px;">肖像</th>
                    <th style="width:200px;">職銜 (Official Title)</th>
                    <th style="width:100px;">職等 / 定員</th>
                    <th style="width:160px;">官員名稱</th>
                    <th>職掌備註 (Notes)</th>
                </tr>
            </thead>
            <tbody id="privy-table-body"></tbody>
        </table>
    </div>

    <div class="wm-sync-footer">
        <span class="editable-field" id="privy-footer-text">註：司憲院為皇家直屬秘書機關，直接向皇帝負責，獨立於內閣行政體系。</span>
        <span id="privy-sync-status" class="loading">讀取中</span>
    </div>
</main>

<script>
(function(){
    const app=document.getElementById('privy-app');
    if(!app || app.dataset.initialized==='true') return;
    app.dataset.initialized='true';

    const tb=document.getElementById('privy-table-body');
    const status=document.getElementById('privy-sync-status');
    const header=document.getElementById('privy-header-area');
    const footer=document.getElementById('privy-footer-text');

    const PRIVY_API='/api/privy';
    const PRIVY_LEGACY_API='https://wme-households-api.onrender.com/api/privy';
    let privyLegacyMode=false;
    async function fetchPrivyApi(options){
        if(privyLegacyMode){
            const legacyOptions={...options,headers:{...(options.headers||{})}};
            if(legacyOptions.headers['X-WME-Edit-Password']){
                legacyOptions.headers['X-Privy-Password']=legacyOptions.headers['X-WME-Edit-Password'];
                delete legacyOptions.headers['X-WME-Edit-Password'];
            }
            return fetch(PRIVY_LEGACY_API,legacyOptions);
        }
        const response=await fetch(PRIVY_API,options);
        const contentType=response.headers.get('content-type')||'';
        if(response.status===404 && !contentType.includes('application/json')){
            privyLegacyMode=true;
            const legacyOptions={...options,headers:{...(options.headers||{})}};
            if(legacyOptions.headers['X-WME-Edit-Password']){
                legacyOptions.headers['X-Privy-Password']=legacyOptions.headers['X-WME-Edit-Password'];
                delete legacyOptions.headers['X-WME-Edit-Password'];
            }
            return fetch(PRIVY_LEGACY_API,legacyOptions);
        }
        return response;
    }
    const PRIVY_RAW='https://raw.githubusercontent.com/annynn1990/wme-list/main/data.json';

    let privyPassword='';
    let editing=false;
    let backup=null;

    const INITIAL_HTML="<tr><th colspan=\"5\" class=\"wm-privy-banner\">院領導核心 (The High Council)</th></tr>\n<tr>\n<td><div class=\"wm-portrait-box\"><img src=\"https://www.wongmingempire.com/bbswm/uc_server/data/avatar/000/00/00/02_avatar_middle.jpg\" class=\"wm-portrait-img\"></div></td>\n<td class=\"col-txt\"><b>大司憲</b></td>\n<td><span class=\"wm-p-rank wm-p-rank-high\">Rank 1</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\">李迎希</td>\n<td class=\"col-txt\">首席秘書官；兼任選舉委員會主席</td>\n</tr>\n<tr>\n<td><div class=\"wm-portrait-box\"><img src=\"https://www.wongmingempire.com/bbswm/uc_server/data/avatar/000/00/01/90_avatar_middle.jpg\" class=\"wm-portrait-img\"></div></td>\n<td class=\"col-txt\"><b>二司憲</b></td>\n<td><span class=\"wm-p-rank\">Rank 2</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\">白敖</td>\n<td class=\"col-txt\">副秘書長</td>\n</tr>\n<tr><th colspan=\"5\" class=\"wm-privy-banner\">下設處室與司局 (Departments & Bureaus)</th></tr>\n<tr>\n<td><div class=\"wm-portrait-box\"></div></td>\n<td class=\"col-txt\">制司處處長<br><small>（司制）</small></td>\n<td><span class=\"wm-p-rank\">Rank 4</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\"></td>\n<td class=\"col-txt\">掌管詔書制作</td>\n</tr>\n<tr>\n<td><div class=\"wm-portrait-box\"><img src=\"https://www.wongmingempire.com/bbswm/uc_server/data/avatar/000/00/03/33_avatar_middle.jpg\" class=\"wm-portrait-img\"></div></td>\n<td class=\"col-txt\">受憲處處長<br><small>（司典）</small></td>\n<td><span class=\"wm-p-rank\">Rank 4</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\">夏侯昜</td>\n<td class=\"col-txt\">掌管典章憲制</td>\n</tr>\n<tr>\n<td><div class=\"wm-portrait-box\"><img src=\"https://www.wongmingempire.com/bbswm/uc_server/data/avatar/000/00/00/89_avatar_middle.jpg\" class=\"wm-portrait-img\"></div></td>\n<td class=\"col-txt\">檔案處處長<br><small>（司吏）</small></td>\n<td><span class=\"wm-p-rank\">Rank 4</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\">小羽</td>\n<td class=\"col-txt\">掌管皇家檔案與吏事</td>\n</tr>\n<tr>\n<td><div class=\"wm-portrait-box\"><img src=\"https://www.wongmingempire.com/bbswm/uc_server/data/avatar/000/00/00/28_avatar_middle.jpg\" class=\"wm-portrait-img\"></div></td>\n<td class=\"col-txt\">司政處處長<br><small>（司政）</small></td>\n<td><span class=\"wm-p-rank\">Rank 4</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\">仲尼</td>\n<td class=\"col-txt\">掌管行政文書</td>\n</tr>\n<tr>\n<td><div class=\"wm-portrait-box\"><img src=\"https://www.wongmingempire.com/bbswm/uc_server/data/avatar/000/00/00/11_avatar_middle.jpg\" class=\"wm-portrait-img\"></div></td>\n<td class=\"col-txt\">律令司<br><small>（司律）</small></td>\n<td><span class=\"wm-p-rank\">Rank 4</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\">路德維希</td>\n<td class=\"col-txt\">掌管皇室律令</td>\n</tr>\n<tr>\n<td><div class=\"wm-portrait-box\"></div></td>\n<td class=\"col-txt\">宗正司</td>\n<td><span class=\"wm-p-rank\">Rank 5</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\"></td>\n<td class=\"col-txt\">掌管宗室事務</td>\n</tr>";

    function setStatus(message,state){
        status.textContent=message;
        status.className=state;
    }

    function cleanEmptyNames(){
        tb.querySelectorAll('.name-field').forEach(function(el){
            if(el.textContent.trim()===''){
                el.innerHTML='';
                el.classList.add('empty-vacancy');
            }else{
                el.classList.remove('empty-vacancy');
            }
        });
    }

    function safeHTML(element){
        const copy=element.cloneNode(true);
        copy.removeAttribute('contenteditable');
        copy.removeAttribute('data-edit-enabled');
        copy.removeAttribute('spellcheck');
        copy.querySelectorAll('[contenteditable],[data-edit-enabled],[spellcheck]').forEach(function(node){
            node.removeAttribute('contenteditable');
            node.removeAttribute('data-edit-enabled');
            node.removeAttribute('spellcheck');
        });
        copy.querySelectorAll('.wm-portrait-box.editable').forEach(function(node){
            node.classList.remove('editable');
        });
        return copy.innerHTML;
    }

    function getSnapshot(){
        return {
            header:safeHTML(header),
            table:safeHTML(tb),
            footer:safeHTML(footer)
        };
    }

    function lockDownEditing(){
        editing=false;
        app.classList.remove('is-editing');
        app.querySelectorAll('[contenteditable],[data-edit-enabled],[spellcheck]').forEach(function(node){
            node.removeAttribute('contenteditable');
            node.removeAttribute('data-edit-enabled');
            node.removeAttribute('spellcheck');
        });
        app.querySelectorAll('.wm-portrait-box.editable').forEach(function(node){
            node.classList.remove('editable');
        });
        const tools=document.getElementById('privy-edit-tools');
        if(tools) tools.hidden=true;
    }

    function markDirty(){
        if(editing) setStatus('尚未儲存','loading');
    }

    function makeEditable(el){
        if(el.dataset.editEnabled==='true') return;
        el.dataset.editEnabled='true';
        el.contentEditable='true';
        el.spellcheck=false;
        el.addEventListener('input',function(){
            if(el.classList.contains('name-field')){
                if(el.textContent.trim()===''){
                    el.innerHTML='';
                    el.classList.add('empty-vacancy');
                }else{
                    el.classList.remove('empty-vacancy');
                }
            }
            markDirty();
        });
    }

    function enableEditing(){
        if(editing) return;
        backup={
            header:header.innerHTML,
            table:tb.innerHTML,
            footer:footer.innerHTML
        };
        editing=true;
        app.classList.add('is-editing');

        app.querySelectorAll('.editable-field').forEach(makeEditable);
        app.querySelectorAll('.wm-wiki-table th').forEach(makeEditable);
        app.querySelectorAll('.wm-wiki-table td.col-txt').forEach(makeEditable);
        app.querySelectorAll('.wm-p-rank,.wm-rank-tag').forEach(makeEditable);
        app.querySelectorAll('.wm-wiki-table td small').forEach(makeEditable);
        tb.querySelectorAll('.wm-portrait-box').forEach(function(box){
            box.classList.add('editable');
        });

        const tools=document.getElementById('privy-edit-tools');
        if(tools) tools.hidden=false;
        setStatus('在線中','online');
    }

    function setBackup(){
        if(!backup) return;
        header.innerHTML=backup.header;
        tb.innerHTML=backup.table;
        footer.innerHTML=backup.footer;
        cleanEmptyNames();
    }

    function closeEditing(){
        lockDownEditing();
        privyPassword='';
        backup=null;
    }


    function createAuthModal(){
        let modal=document.getElementById('privy-auth-modal');
        if(modal) return modal;

        modal=document.createElement('div');
        modal.id='privy-auth-modal';
        modal.className='privy-auth-modal';
        modal.hidden=true;
        modal.innerHTML=
            '<div class="privy-auth-card" role="dialog" aria-modal="true" aria-labelledby="privy-auth-title">'+
                '<div class="privy-auth-title" id="privy-auth-title">司憲院管理員驗證</div>'+
                '<label class="privy-auth-label" for="privy-admin-password">管理密碼</label>'+
                '<input class="privy-auth-input" id="privy-admin-password" type="password" autocomplete="off" placeholder="輸入管理密碼">'+
                '<div class="privy-auth-help">輸入管理密碼即可編輯，修改後直接儲存至雲端。</div>'+
                '<div class="privy-auth-error" id="privy-auth-error"></div>'+
                '<div class="privy-auth-actions">'+
                    '<button type="button" id="privy-auth-cancel">取消</button>'+
                    '<button type="button" id="privy-auth-submit">驗證並編輯</button>'+
                '</div>'+
            '</div>';

        document.body.appendChild(modal);

        const passwordInput=modal.querySelector('#privy-admin-password');
        const error=modal.querySelector('#privy-auth-error');

        function dismiss(){
            modal.hidden=true;
            passwordInput.value='';
            error.textContent='';
        }

        modal.querySelector('#privy-auth-cancel').addEventListener('click',dismiss);

        modal.querySelector('#privy-auth-submit').addEventListener('click',async function(){
            const password=passwordInput.value;
            if(!password){
                error.textContent='請輸入管理密碼。';
                return;
            }

            const button=modal.querySelector('#privy-auth-submit');
            button.disabled=true;
            error.textContent='正在驗證……';

            try{
                await verifyPrivyPassword(password);
                privyPassword=password;
                dismiss();
                enableEditing();
            }catch(e){
                error.textContent=e.message||'管理員驗證失敗。';
            }finally{
                button.disabled=false;
            }
        });

        modal.addEventListener('keydown',function(e){
            if(e.key==='Escape') dismiss();
            if(e.key==='Enter' && e.target.tagName==='INPUT'){
                modal.querySelector('#privy-auth-submit').click();
            }
        });

        return modal;
    }

    async function verifyPrivyPassword(password){
        const response=await fetchPrivyApi({
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({action:'verify',password:password}),
            cache:'no-store'
        });
        const result=await response.json().catch(function(){return {};});
        if(response.status===403) throw new Error('管理密碼錯誤。');
        if(!response.ok) throw new Error(result.error||('驗證服務暫時無法使用（HTTP '+response.status+'）。'));
        return true;
    }

    async function saveToCloud(){
        if(!editing || !privyPassword) return;

        const saveButton=document.getElementById('privy-save-button');
        if(saveButton) saveButton.disabled=true;
        setStatus('正在儲存','loading');

        try{
            const response=await fetchPrivyApi({
                method:'PUT',
                headers:{
                    'Content-Type':'application/json',
                    'X-WME-Edit-Password':privyPassword
                },
                body:JSON.stringify({savedData:getSnapshot()}),
                cache:'no-store'
            });
            const result=await response.json().catch(function(){return {};});
            if(!response.ok) throw new Error(result.error||('雲端儲存失敗（HTTP '+response.status+'）。'));

            closeEditing();
            setStatus('在線中','online');
        }catch(e){
            setStatus('離線中','error');
            alert(e.message||'雲端儲存失敗，修改尚未提交。');
        }finally{
            if(saveButton) saveButton.disabled=false;
        }
    }

    function bindToolbar(){
        const saveButton=document.getElementById('privy-save-button');
        const cancelButton=document.getElementById('privy-cancel-button');
        if(saveButton) saveButton.addEventListener('click',saveToCloud);
        if(cancelButton) cancelButton.addEventListener('click',cancelEditing);
    }

    function cancelEditing(){
        if(!editing) return;
        if(!confirm('放棄本次尚未提交的修改？')) return;
        setBackup();
        closeEditing();
        setStatus('在線中','online');
    }

    function bindToolbar(){
        const saveButton=document.getElementById('privy-save-button');
        const cancelButton=document.getElementById('privy-cancel-button');
        if(saveButton) saveButton.addEventListener('click',saveToGitHub);
        if(cancelButton) cancelButton.addEventListener('click',cancelEditing);
    }

    tb.addEventListener('click',function(e){
        if(!editing) return;
        const box=e.target.closest('.wm-portrait-box');
        if(!box) return;

        const url=prompt('輸入新肖像網址：');
        if(!url) return;

        try{
            const parsed=new URL(url.trim());
            if(parsed.protocol!=='https:' && parsed.protocol!=='http:'){
                alert('請輸入有效的圖片網址。');
                return;
            }
            const img=document.createElement('img');
            img.src=parsed.href;
            img.className='wm-portrait-img';
            img.alt='官員肖像';
            box.replaceChildren(img);
            markDirty();
        }catch(e){
            alert('圖片網址格式不正確。');
        }
    });

    async function loadData(){
        setStatus('讀取中','loading');
        let timeout=null;
        try{
            const controller=new AbortController();
            timeout=setTimeout(function(){controller.abort();},12000);
            let response=await fetch(PRIVY_API,{
                cache:'no-store',
                signal:controller.signal
            });
            const apiContentType=response.headers.get('content-type')||'';
            if(response.status===404 && !apiContentType.includes('application/json')){
                response=await fetch('./data.json',{
                    cache:'no-cache',
                    signal:controller.signal
                });
            }
            if(!response.ok) throw new Error('司憲院資料讀取失敗（HTTP '+response.status+'）。');
            const data=await response.json();
            if(data.savedData){
                if(typeof data.savedData.header==='string') header.innerHTML=data.savedData.header;
                if(typeof data.savedData.table==='string') tb.innerHTML=data.savedData.table;
                if(typeof data.savedData.footer==='string') footer.innerHTML=data.savedData.footer;
            }else if(typeof data.savedHTML==='string'){
                tb.innerHTML=data.savedHTML;
            }else{
                throw new Error('data.json 缺少 savedHTML。');
            }
            lockDownEditing();
            cleanEmptyNames();
            status.title='';
            setStatus('在線中','online');
        }catch(e){
            console.error('司憲院資料讀取失敗：',e);
            tb.innerHTML=INITIAL_HTML;
            lockDownEditing();
            cleanEmptyNames();
            status.title=e && e.message ? e.message : '未知讀取錯誤';
            setStatus('離線中','error');
        }finally{
            if(timeout!==null) clearTimeout(timeout);
            scheduleEmbedHeight();
        }
    }

    const editTrigger=document.getElementById('privy-edit-trigger');
    editTrigger.addEventListener('click',function(){
        if(editing) return;
        const modal=createAuthModal();
        modal.hidden=false;
        const passwordInput=modal.querySelector('#privy-admin-password');
        setTimeout(function(){passwordInput.focus();},0);
    });

    bindToolbar();
    loadData().then(scheduleEmbedHeight);

    // iframe 嵌入支援：只回報內容本身高度，不把 iframe 視窗高度算進去。
    function notifyEmbedHeight(){
        if(window.parent===window) return;
        const rect=app.getBoundingClientRect();
        const style=window.getComputedStyle(app);
        const marginBottom=parseFloat(style.marginBottom)||0;
        const height=Math.ceil(rect.bottom+window.scrollY+marginBottom);
        window.parent.postMessage({
            type:'wme-privy-embed-height',
            height:Math.max(height,1)
        },'*');
    }

    let embedHeightFrame=0;
    function scheduleEmbedHeight(){
        if(window.parent===window) return;
        cancelAnimationFrame(embedHeightFrame);
        embedHeightFrame=requestAnimationFrame(function(){
            requestAnimationFrame(notifyEmbedHeight);
        });
    }

    if(window.parent!==window){
        window.addEventListener('load',scheduleEmbedHeight);
        window.addEventListener('resize',scheduleEmbedHeight);

        if('ResizeObserver' in window){
            const embedResizeObserver=new ResizeObserver(scheduleEmbedHeight);
            embedResizeObserver.observe(document.documentElement);
            embedResizeObserver.observe(app);
        }

        const embedMutationObserver=new MutationObserver(scheduleEmbedHeight);
        embedMutationObserver.observe(app,{
            childList:true,
            subtree:true,
            characterData:true,
            attributes:true
        });

        if(document.fonts && document.fonts.ready){
            document.fonts.ready.then(scheduleEmbedHeight);
        }
        scheduleEmbedHeight();
    }


})();
</script>
