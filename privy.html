<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>司憲院制司受憲秘閣院職官表</title>
<style>
:root{--purple:#4b0082;--gold:#d4af37;--border:#a2a9b1}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#f5f5f5;color:#202122;font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif}
#privy-app{max-width:1000px;margin:20px auto;font-family:inherit;color:#202122;background:#fff;border:1px solid #a2a9b1;padding:25px;box-shadow:0 4px 12px rgba(0,0,0,.15);line-height:1.6;position:relative}
#edit-trigger{position:absolute;top:25px;right:25px;cursor:pointer;font-size:18px;color:#eee;transition:color .3s;z-index:10}
#edit-trigger:hover{color:#4b0082}
#privy-app .wm-privy-table{width:100%;border-collapse:collapse;margin-bottom:30px;border:1px solid #a2a9b1;table-layout:fixed}
#privy-app .wm-privy-table th{background:#f8f9fa;border:1px solid #a2a9b1;padding:12px 8px;text-align:center;font-weight:bold}
#privy-app .wm-privy-table td{border:1px solid #a2a9b1;padding:10px 8px;vertical-align:middle}
#privy-app .wm-privy-banner{background:#4b0082!important;color:#fff!important;font-size:16px;text-align:left!important;padding-left:15px!important;letter-spacing:1px}
#privy-app .wm-p-rank-high{display:inline-block;padding:2px 10px;background:#4b0082!important;color:#f1c40f!important;border:1px solid #d4af37!important;border-radius:4px;font-size:12px;font-weight:bold}
#privy-app .wm-p-rank{display:inline-block;padding:2px 10px;background:#fcf3cf;color:#9a7d0a;border-radius:4px;font-size:12px;font-weight:bold;border:1px solid #d4af37}
#privy-app .wm-portrait-box{width:80px;height:100px;background:#faf9f6;border:1px solid #d4af37;margin:0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:4px;position:relative}
#privy-app .wm-portrait-img{width:100%;height:100%;object-fit:cover}
#privy-app .name-field{color:#202122!important;font-family:inherit!important;font-size:16px!important;font-weight:normal!important;text-align:center}
#privy-app .name-field.empty-vacancy:after{content:"懸缺";color:#bdc3c7;font-style:italic;font-weight:normal}
#privy-app.is-editing [contenteditable="true"]{outline:2px dashed #4b0082!important;background:#f7f9ff!important;cursor:text}
#privy-app .sync{font-size:12px;color:#7f8c8d;font-style:italic;border-left:3px solid #d4af37;padding-left:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
#privy-app #sync-status{display:inline-flex;align-items:center;gap:7px;font-style:normal;font-weight:bold;white-space:nowrap}
#privy-app #sync-status:before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
#privy-app #sync-status.online{color:#27ae60!important}
#privy-app #sync-status.online:before{animation:wme-green-breathe 1.8s ease-in-out infinite;box-shadow:0 0 5px currentColor}
#privy-app #sync-status.loading{color:#f1c40f!important}
#privy-app #sync-status.error{color:#e74c3c!important}
@keyframes wme-green-breathe{0%,100%{opacity:.55;box-shadow:0 0 4px currentColor,0 0 8px rgba(39,174,96,.25)}50%{opacity:1;box-shadow:0 0 8px currentColor,0 0 18px rgba(39,174,96,.6)}}
@media(max-width:700px){
#privy-app{margin:0;padding:15px;box-shadow:none}
#privy-app h1{font-size:23px!important}
#privy-app .wm-privy-table{font-size:14px;min-width:760px}
#privy-app .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
#privy-app .wm-portrait-box{width:64px;height:80px}
#privy-app .sync{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<main class="wm-privy-wrapper" id="privy-app">
<div id="edit-trigger" title="管理員編輯">⚙️</div>
<div class="header" style="border-bottom:3px solid #4b0082;margin-bottom:20px;padding-bottom:10px;padding-right:35px;">
<h1 style="margin:0;color:#000;font-size:30px;letter-spacing:2px;">司憲院制司受憲秘閣院職官表</h1>
<div class="subtitle" style="font-size:14px;color:#54595d;font-style:italic;margin-top:5px;">Privy Council — List of Imperial Secretarial Officials</div>
</div>
<div class="table-scroll">
<table class="wm-privy-table">
<thead>
<tr>
<th style="width:100px">肖像</th>
<th style="width:200px">職銜 (Official Title)</th>
<th style="width:100px">職等 / 定員</th>
<th style="width:160px">官員名稱</th>
<th>職掌備註 (Notes)</th>
</tr>
</thead>
<tbody id="table-body"></tbody>
</table>
</div>
<div class="sync">
<span id="sync-note">註：司憲院為皇家直屬秘書機關，直接向皇帝負責，獨立於內閣行政體系。</span>
<span id="sync-status" class="loading">讀取資料中</span>
</div>
</main>

<script>
(function(){
const app=document.getElementById('privy-app');
const tb=document.getElementById('table-body');
const syncStatus=document.getElementById('sync-status');
const LOCAL_KEY='wme-list-privy-edit-html';
const DATA_URL='https://raw.githubusercontent.com/annynn1990/wme-list/main/data.json?ts='+Date.now();
const INITIAL_HTML="<tr><th colspan=\"5\" class=\"wm-privy-banner\">院領導核心 (The High Council)</th></tr>\n<tr>\n<td><div class=\"wm-portrait-box\"><img src=\"https://www.wongmingempire.com/bbswm/uc_server/data/avatar/000/00/00/02_avatar_middle.jpg\" class=\"wm-portrait-img\"></div></td>\n<td class=\"col-txt\"><b>大司憲</b></td>\n<td><span class=\"wm-p-rank wm-p-rank-high\">Rank 1</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\">李迎希</td>\n<td class=\"col-txt\">首席秘書官；兼任選舉委員會主席</td>\n</tr>\n<tr>\n<td><div class=\"wm-portrait-box\"><img src=\"https://www.wongmingempire.com/bbswm/uc_server/data/avatar/000/00/01/90_avatar_middle.jpg\" class=\"wm-portrait-img\"></div></td>\n<td class=\"col-txt\"><b>二司憲</b></td>\n<td><span class=\"wm-p-rank\">Rank 2</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\">白敖</td>\n<td class=\"col-txt\">副秘書長</td>\n</tr>\n<tr><th colspan=\"5\" class=\"wm-privy-banner\">下設處室與司局 (Departments & Bureaus)</th></tr>\n<tr>\n<td><div class=\"wm-portrait-box\"></div></td>\n<td class=\"col-txt\">制司處處長<br><small>（司制）</small></td>\n<td><span class=\"wm-p-rank\">Rank 4</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\"></td>\n<td class=\"col-txt\">掌管詔書制作</td>\n</tr>\n<tr>\n<td><div class=\"wm-portrait-box\"><img src=\"https://www.wongmingempire.com/bbswm/uc_server/data/avatar/000/00/03/33_avatar_middle.jpg\" class=\"wm-portrait-img\"></div></td>\n<td class=\"col-txt\">受憲處處長<br><small>（司典）</small></td>\n<td><span class=\"wm-p-rank\">Rank 4</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\">夏侯昜</td>\n<td class=\"col-txt\">掌管典章憲制</td>\n</tr>\n<tr>\n<td><div class=\"wm-portrait-box\"><img src=\"https://www.wongmingempire.com/bbswm/uc_server/data/avatar/000/00/00/89_avatar_middle.jpg\" class=\"wm-portrait-img\"></div></td>\n<td class=\"col-txt\">檔案處處長<br><small>（司吏）</small></td>\n<td><span class=\"wm-p-rank\">Rank 4</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\">小羽</td>\n<td class=\"col-txt\">掌管皇家檔案與吏事</td>\n</tr>\n<tr>\n<td><div class=\"wm-portrait-box\"><img src=\"https://www.wongmingempire.com/bbswm/uc_server/data/avatar/000/00/00/28_avatar_middle.jpg\" class=\"wm-portrait-img\"></div></td>\n<td class=\"col-txt\">司政處處長<br><small>（司政）</small></td>\n<td><span class=\"wm-p-rank\">Rank 4</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\">仲尼</td>\n<td class=\"col-txt\">掌管行政文書</td>\n</tr>\n<tr>\n<td><div class=\"wm-portrait-box\"><img src=\"https://www.wongmingempire.com/bbswm/uc_server/data/avatar/000/00/00/11_avatar_middle.jpg\" class=\"wm-portrait-img\"></div></td>\n<td class=\"col-txt\">律令司<br><small>（司律）</small></td>\n<td><span class=\"wm-p-rank\">Rank 4</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\">路德維希</td>\n<td class=\"col-txt\">掌管皇室律令</td>\n</tr>\n<tr>\n<td><div class=\"wm-portrait-box\"></div></td>\n<td class=\"col-txt\">宗正司</td>\n<td><span class=\"wm-p-rank\">Rank 5</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\"></td>\n<td class=\"col-txt\">掌管宗室事務</td>\n</tr>";

function setStatus(text,state){
 syncStatus.textContent=text;
 syncStatus.className=state;
}

function saveLocal(){
 try{
  localStorage.setItem(LOCAL_KEY,tb.innerHTML);
  setStatus('正常連線','online');
 }catch(e){}
}

function restoreLocal(){
 try{
  const saved=localStorage.getItem(LOCAL_KEY);
  if(saved){
   tb.innerHTML=saved;
   return true;
  }
 }catch(e){}
 return false;
}

function normalizeVacancies(){
 tb.querySelectorAll('.name-field').forEach(function(el){
  if(el.textContent.trim()===''){
   el.innerHTML='';
   el.classList.add('empty-vacancy');
  }else{
   el.classList.remove('empty-vacancy');
  }
 });
}

function makeEditable(el){
 el.contentEditable='true';
 el.spellcheck=false;
 el.oninput=function(){
  if(el.classList.contains('name-field')){
   if(el.textContent.trim()===''){
    el.innerHTML='';
    el.classList.add('empty-vacancy');
   }else{
    el.classList.remove('empty-vacancy');
   }
  }
  saveLocal();
 };
 el.onblur=function(){saveLocal();};
}

function enableEditing(){
 app.classList.add('is-editing');
 normalizeVacancies();

 app.querySelectorAll('.header h1,.header .subtitle').forEach(makeEditable);
 app.querySelectorAll('.wm-privy-table th').forEach(makeEditable);
 app.querySelectorAll('.wm-privy-table td.col-txt').forEach(makeEditable);
 app.querySelectorAll('.wm-privy-table .wm-p-rank').forEach(makeEditable);
 app.querySelectorAll('.wm-privy-table td small').forEach(makeEditable);
 const note=document.getElementById('sync-note');
 if(note)makeEditable(note);

 app.querySelectorAll('.wm-portrait-box').forEach(function(box){
  box.onclick=function(){
   const url=prompt('輸入新肖像網址：');
   if(url){
    const img=document.createElement('img');
    img.src=url;
    img.className='wm-portrait-img';
    box.replaceChildren(img);
    saveLocal();
   }
  };
 });

 setStatus('正常連線','online');
}

async function loadData(){
 setStatus('讀取資料中','loading');
 try{
  const local=restoreLocal();
  if(!local){
   const r=await fetch(DATA_URL,{cache:'no-store'});
   if(!r.ok)throw new Error('HTTP '+r.status);
   const d=await r.json();
   if(!d.savedHTML)throw new Error('資料格式錯誤');
   tb.innerHTML=d.savedHTML;
  }
  normalizeVacancies();
  setStatus('正常連線','online');
 }catch(e){
  try{tb.innerHTML=INITIAL_HTML;normalizeVacancies();setStatus('正常連線','online');}
  catch(_){setStatus('連線失敗','error');}
 }
}

document.getElementById('edit-trigger').onclick=function(){
 if(prompt('管理員驗證：')==='1111')enableEditing();
 else alert('驗證失敗。');
};

loadData();
})();
</script>
</body>
</html>
