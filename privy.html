<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>司憲院制司受憲秘閣院職官表</title>
<style>
:root{
    --privy-purple:#4b0082;
    --privy-gold:#d4af37;
    --privy-border:#a2a9b1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
    background:#f5f5f5;
    color:#202122;
    font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
}
#privy-app{
    max-width:1000px;
    margin:20px auto;
    font-family:inherit;
    color:#202122;
    background:#fff;
    border:1px solid var(--privy-border);
    padding:25px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    line-height:1.6;
    position:relative;
}
#privy-edit-trigger{
    position:absolute;
    top:25px;
    right:25px;
    cursor:pointer;
    font-size:18px;
    color:#eee;
    transition:color .3s;
    z-index:999;
}
#privy-edit-trigger:hover{color:var(--privy-purple)}
#privy-header-area{
    border-bottom:3px solid var(--privy-purple);
    margin-bottom:20px;
    padding-bottom:10px;
    padding-right:35px;
}
#privy-header-area h2{
    margin:0;
    color:#000;
    font-size:30px;
    font-weight:bold;
    letter-spacing:2px;
}
#privy-header-area .subtitle{
    font-size:14px;
    color:#54595d;
    font-style:italic;
    margin-top:5px;
}

/* 與內閣共用同一套表格結構 */
#privy-app .wm-wiki-table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:30px;
    border:1px solid var(--privy-border);
    table-layout:fixed;
}
#privy-app .wm-wiki-table th{
    background:#f8f9fa;
    border:1px solid var(--privy-border);
    padding:12px 8px;
    text-align:center;
    font-weight:bold;
    color:#000;
}
#privy-app .wm-wiki-table td{
    border:1px solid var(--privy-border);
    padding:10px 8px;
    vertical-align:middle;
}

/* 司憲院紫色部門橫幅 */
#privy-app .wm-dept-banner,
#privy-app .wm-privy-banner{
    background:var(--privy-purple)!important;
    color:#fff!important;
    font-size:16px!important;
    font-weight:bold;
    text-align:left!important;
    padding-left:15px!important;
    letter-spacing:1px;
}

/* 官員名稱 */
#privy-app .wm-incumbent,
#privy-app .name-field{
    font-weight:900!important;
    color:#000!important;
    font-size:16px!important;
    text-align:left!important;
    padding-left:15px!important;
    min-height:1.2em;
}
#privy-app .name-field.empty-vacancy:after{
    content:"懸缺";
    color:#bdc3c7!important;
    font-style:italic!important;
    font-weight:normal!important;
}

/* 肖像 */
#privy-app .wm-portrait-box{
    width:80px;
    height:100px;
    background:#faf9f6;
    border:1px solid var(--privy-gold);
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-radius:4px;
    position:relative;
}
#privy-app .wm-portrait-box.editable{cursor:pointer}
#privy-app .wm-portrait-img{
    width:100%;
    height:100%;
    object-fit:cover;
}
#privy-app .wm-portrait-placeholder{
    font-size:11px;
    color:#888;
    text-align:center;
}

/* 職等標籤：保留司憲院紫金色 */
#privy-app .wm-rank-tag,
#privy-app .wm-p-rank{
    display:inline-block;
    padding:2px 10px;
    background:#fcf3cf;
    color:#9a7d0a;
    border-radius:4px;
    font-size:12px;
    font-weight:bold;
    border:1px solid var(--privy-gold);
}
#privy-app .wm-rank-high,
#privy-app .wm-p-rank-high{
    background:var(--privy-purple)!important;
    color:#f1c40f!important;
    border:1px solid var(--privy-gold)!important;
}
#privy-app .wm-rank-subchief{
    background:#829cc9!important;
    color:#fff!important;
    border:1px solid #7189b1;
}
#privy-app .wm-rank-adjunct{
    background:#f1f5f9;
    color:#64748b;
    border:1px solid #e2e8f0;
}

/* 編輯狀態 */
#privy-app.is-editing [contenteditable="true"]{
    outline:2px dashed var(--privy-purple)!important;
    background:#fff8dc!important;
    cursor:text;
}
#privy-app.is-editing .wm-portrait-box{
    cursor:pointer;
}

/* 頁尾與同步燈號 */
#privy-app .wm-sync-footer{
    font-size:12px;
    color:#72777d;
    font-style:italic;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    border-left:3px solid var(--privy-gold);
    padding:2px 0 2px 12px;
    margin-top:15px;
    line-height:1.5;
}
#privy-app #privy-sync-status{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-style:normal;
    font-weight:bold;
    white-space:nowrap;
}
#privy-app #privy-sync-status:before{
    content:"";
    width:9px;
    height:9px;
    border-radius:50%;
    background:currentColor;
}
#privy-app #privy-sync-status.online{color:#27ae60!important}
#privy-app #privy-sync-status.online:before{
    animation:privy-green-breathe 1.8s ease-in-out infinite;
    box-shadow:0 0 5px currentColor;
}
#privy-app #privy-sync-status.loading{color:#d4af37!important}
#privy-app #privy-sync-status.error{color:#e74c3c!important}
#privy-app #privy-sync-status.local{color:#7f8c8d!important}
@keyframes privy-green-breathe{
    0%,100%{opacity:.55;box-shadow:0 0 4px currentColor,0 0 8px rgba(39,174,96,.25)}
    50%{opacity:1;box-shadow:0 0 8px currentColor,0 0 18px rgba(39,174,96,.6)}
}

@media(max-width:700px){
    #privy-app{
        margin:0;
        padding:15px;
        box-shadow:none;
    }
    #privy-header-area h2{font-size:23px}
    #privy-app .wm-wiki-table{
        font-size:14px;
        min-width:760px;
    }
    #privy-app .table-scroll{
        overflow-x:auto;
        -webkit-overflow-scrolling:touch;
    }
    #privy-app .wm-portrait-box{
        width:64px;
        height:80px;
    }
    #privy-app .wm-sync-footer{
        align-items:flex-start;
        flex-direction:column;
    }
}
</style>
</head>
<body>
<main class="wm-wiki-wrapper" id="privy-app">
    <div id="privy-edit-trigger" title="管理員編輯">⚙️</div>

    <div id="privy-header-area">
        <h2 class="editable-field">司憲院制司受憲秘閣院職官表</h2>
        <div class="subtitle editable-field">Privy Council — List of Imperial Secretarial Officials</div>
    </div>

    <div class="table-scroll">
        <table class="wm-wiki-table">
            <thead>
                <tr>
                    <th style="width:100px;">肖像</th>
                    <th style="width:200px;">職銜 (Official Title)</th>
                    <th style="width:100px;">職等 / 定員</th>
                    <th style="width:160px;">官員名稱</th>
                    <th>職掌備註 (Notes)</th>
                </tr>
            </thead>
            <tbody id="privy-table-body"></tbody>
        </table>
    </div>

    <div class="wm-sync-footer">
        <span class="editable-field" id="privy-footer-text">註：司憲院為皇家直屬秘書機關，直接向皇帝負責，獨立於內閣行政體系。</span>
        <span id="privy-sync-status" class="loading">正在讀取資料</span>
    </div>
</main>

<script>
(function(){
    const app=document.getElementById('privy-app');
    if(!app || app.dataset.initialized==='true') return;
    app.dataset.initialized='true';

    const tb=document.getElementById('privy-table-body');
    const status=document.getElementById('privy-sync-status');
    const header=document.getElementById('privy-header-area');
    const footer=document.getElementById('privy-footer-text');
    const API='https://wme-list.vercel.app/api/privy';
    const EDIT_PASSWORD='1111';
    let saveTimer=null;
    let saveInProgress=false;
    let saveQueued=false;

    const INITIAL_HTML="<tr><th colspan=\"5\" class=\"wm-privy-banner\">院領導核心 (The High Council)</th></tr>\n<tr>\n<td><div class=\"wm-portrait-box\"><img src=\"https://www.wongmingempire.com/bbswm/uc_server/data/avatar/000/00/00/02_avatar_middle.jpg\" class=\"wm-portrait-img\"></div></td>\n<td class=\"col-txt\"><b>大司憲</b></td>\n<td><span class=\"wm-p-rank wm-p-rank-high\">Rank 1</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\">李迎希</td>\n<td class=\"col-txt\">首席秘書官；兼任選舉委員會主席</td>\n</tr>\n<tr>\n<td><div class=\"wm-portrait-box\"><img src=\"https://www.wongmingempire.com/bbswm/uc_server/data/avatar/000/00/01/90_avatar_middle.jpg\" class=\"wm-portrait-img\"></div></td>\n<td class=\"col-txt\"><b>二司憲</b></td>\n<td><span class=\"wm-p-rank\">Rank 2</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\">白敖</td>\n<td class=\"col-txt\">副秘書長</td>\n</tr>\n<tr><th colspan=\"5\" class=\"wm-privy-banner\">下設處室與司局 (Departments & Bureaus)</th></tr>\n<tr>\n<td><div class=\"wm-portrait-box\"></div></td>\n<td class=\"col-txt\">制司處處長<br><small>（司制）</small></td>\n<td><span class=\"wm-p-rank\">Rank 4</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\"></td>\n<td class=\"col-txt\">掌管詔書制作</td>\n</tr>\n<tr>\n<td><div class=\"wm-portrait-box\"><img src=\"https://www.wongmingempire.com/bbswm/uc_server/data/avatar/000/00/03/33_avatar_middle.jpg\" class=\"wm-portrait-img\"></div></td>\n<td class=\"col-txt\">受憲處處長<br><small>（司典）</small></td>\n<td><span class=\"wm-p-rank\">Rank 4</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\">夏侯昜</td>\n<td class=\"col-txt\">掌管典章憲制</td>\n</tr>\n<tr>\n<td><div class=\"wm-portrait-box\"><img src=\"https://www.wongmingempire.com/bbswm/uc_server/data/avatar/000/00/00/89_avatar_middle.jpg\" class=\"wm-portrait-img\"></div></td>\n<td class=\"col-txt\">檔案處處長<br><small>（司吏）</small></td>\n<td><span class=\"wm-p-rank\">Rank 4</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\">小羽</td>\n<td class=\"col-txt\">掌管皇家檔案與吏事</td>\n</tr>\n<tr>\n<td><div class=\"wm-portrait-box\"><img src=\"https://www.wongmingempire.com/bbswm/uc_server/data/avatar/000/00/00/28_avatar_middle.jpg\" class=\"wm-portrait-img\"></div></td>\n<td class=\"col-txt\">司政處處長<br><small>（司政）</small></td>\n<td><span class=\"wm-p-rank\">Rank 4</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\">仲尼</td>\n<td class=\"col-txt\">掌管行政文書</td>\n</tr>\n<tr>\n<td><div class=\"wm-portrait-box\"><img src=\"https://www.wongmingempire.com/bbswm/uc_server/data/avatar/000/00/00/11_avatar_middle.jpg\" class=\"wm-portrait-img\"></div></td>\n<td class=\"col-txt\">律令司<br><small>（司律）</small></td>\n<td><span class=\"wm-p-rank\">Rank 4</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\">路德維希</td>\n<td class=\"col-txt\">掌管皇室律令</td>\n</tr>\n<tr>\n<td><div class=\"wm-portrait-box\"></div></td>\n<td class=\"col-txt\">宗正司</td>\n<td><span class=\"wm-p-rank\">Rank 5</span><br><small>定員 1</small></td>\n<td class=\"col-txt name-field\"></td>\n<td class=\"col-txt\">掌管宗室事務</td>\n</tr>";

    function setStatus(message,state){
        status.textContent=message;
        status.className=state;
    }

    function cleanEmptyNames(){
        tb.querySelectorAll('.name-field').forEach(function(el){
            if(el.textContent.trim()===''){
                el.innerHTML='';
                el.classList.add('empty-vacancy');
            }else{
                el.classList.remove('empty-vacancy');
            }
        });
    }

    function snapshot(){
        return {
            header:header.innerHTML,
            table:tb.innerHTML,
            footer:footer.innerHTML
        };
    }

    async function saveCloud(){
        if(!app.classList.contains('is-editing')) return;
        if(saveInProgress){
            saveQueued=true;
            return;
        }
        saveInProgress=true;
        setStatus('正在儲存雲端資料','loading');

        try{
            const response=await fetch(API,{
                method:'PUT',
                headers:{
                    'Content-Type':'application/json',
                    'X-Edit-Password':EDIT_PASSWORD
                },
                body:JSON.stringify({savedData:snapshot()})
            });
            const result=await response.json();
            if(!response.ok) throw new Error(result.error||('HTTP '+response.status));
            setStatus('雲端同步成功','online');
        }catch(error){
            setStatus('雲端儲存失敗：'+error.message,'error');
        }finally{
            saveInProgress=false;
            if(saveQueued){
                saveQueued=false;
                saveCloud();
            }
        }
    }

    function scheduleSave(){
        setStatus('有未儲存的修改','loading');
        if(saveTimer) clearTimeout(saveTimer);
        saveTimer=setTimeout(saveCloud,700);
    }

    function makeEditable(el){
        if(el.dataset.editEnabled==='true') return;
        el.dataset.editEnabled='true';
        el.contentEditable='true';
        el.spellcheck=false;
        el.addEventListener('input',function(){
            if(el.classList.contains('name-field')){
                if(el.textContent.trim()===''){
                    el.innerHTML='';
                    el.classList.add('empty-vacancy');
                }else{
                    el.classList.remove('empty-vacancy');
                }
            }
            scheduleSave();
        });
        el.addEventListener('blur',scheduleSave);
    }

    function enableEditing(){
        if(app.classList.contains('is-editing')) return;
        app.classList.add('is-editing');
        cleanEmptyNames();
        app.querySelectorAll('.editable-field').forEach(makeEditable);
        app.querySelectorAll('.wm-wiki-table th').forEach(makeEditable);
        app.querySelectorAll('.wm-wiki-table td.col-txt').forEach(makeEditable);
        app.querySelectorAll('.wm-p-rank,.wm-rank-tag').forEach(makeEditable);
        app.querySelectorAll('.wm-wiki-table td small').forEach(makeEditable);
        tb.querySelectorAll('.wm-portrait-box').forEach(function(box){
            box.classList.add('editable');
        });
        setStatus('編輯模式已啟動','online');
    }

    tb.addEventListener('click',function(e){
        if(!app.classList.contains('is-editing')) return;
        const box=e.target.closest('.wm-portrait-box');
        if(!box) return;
        const url=prompt('輸入新肖像網址：');
        if(!url) return;
        try{
            const parsed=new URL(url.trim());
            if(parsed.protocol!=='https:' && parsed.protocol!=='http:'){
                alert('請輸入有效的圖片網址。');
                return;
            }
            const img=document.createElement('img');
            img.src=parsed.href;
            img.className='wm-portrait-img';
            img.alt='官員肖像';
            box.replaceChildren(img);
            scheduleSave();
        }catch(error){
            alert('圖片網址格式不正確。');
        }
    });

    async function verifyPassword(password){
        const response=await fetch(API,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({action:'verify',password:password})
        });
        const result=await response.json();
        if(!response.ok) throw new Error(result.error||'管理密碼驗證失敗');
        return true;
    }

    async function loadData(){
        setStatus('正在讀取雲端資料','loading');
        try{
            const response=await fetch(API,{cache:'no-store'});
            const result=await response.json();
            if(!response.ok) throw new Error(result.error||('HTTP '+response.status));

            if(result.savedData){
                if(typeof result.savedData.header==='string') header.innerHTML=result.savedData.header;
                tb.innerHTML=result.savedData.table;
                if(typeof result.savedData.footer==='string') footer.innerHTML=result.savedData.footer;
            }else if(typeof result.savedHTML==='string'){
                tb.innerHTML=result.savedHTML;
            }else{
                throw new Error('雲端資料格式錯誤');
            }
            cleanEmptyNames();
            setStatus('雲端資料讀取成功','online');
        }catch(error){
            tb.innerHTML=INITIAL_HTML;
            cleanEmptyNames();
            setStatus('雲端讀取失敗：'+error.message,'error');
        }
    }

    document.getElementById('privy-edit-trigger').onclick=async function(){
        const password=prompt('管理員驗證：');
        if(password===null) return;
        try{
            await verifyPassword(password);
            enableEditing();
            alert('司憲院職官表編輯功能已啟動，修改將直接同步至雲端。');
        }catch(error){
            alert(error.message);
        }
    };

    loadData();
})();
</script>
</body>
</html>
