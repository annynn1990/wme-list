<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>國民大街住戶列表</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#fff;color:#222;font-family:Arial,"Microsoft JhengHei",sans-serif;font-size:13px}
.wrap{max-width:1100px;margin:8px auto;padding:0 6px}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;padding:2px 0 5px}
.title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:7px}
.db-light{width:9px;height:9px;border-radius:50%;display:inline-block;background:#2ecc71;box-shadow:0 0 5px #2ecc71;animation:db-breathe 1.8s ease-in-out infinite}
.db-light.offline{background:#e74c3c;box-shadow:0 0 5px #e74c3c;animation:none}
@keyframes db-breathe{0%,100%{opacity:.55;transform:scale(.9);box-shadow:0 0 4px #2ecc71}50%{opacity:1;transform:scale(1.15);box-shadow:0 0 9px #2ecc71,0 0 16px rgba(46,204,113,.35)}}
.lock{border:0;background:#d60000;color:#fff;width:31px;height:29px;border-radius:3px;font-size:16px;cursor:pointer;padding:0}
.lock:hover{background:#b00000}
.tools{display:flex;gap:4px;margin:4px 0}
button.tool{border:1px solid #999;background:#f5f5f5;color:#222;padding:3px 7px;border-radius:3px;font:inherit;cursor:pointer}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{border:1px solid #999;padding:3px 5px;line-height:1.2;vertical-align:middle}
th{font-weight:700;background:#eee;text-align:center}
th:nth-child(1){width:18%}
th:nth-child(2){width:25%}
th:nth-child(3){width:16%}
th:nth-child(4){width:13%}
th.status-head{width:7%;font-size:11px}
.name{font-weight:700}
.year{text-align:center;white-space:nowrap}
.editing td{background:#fffef2}
input.text,input[type=number]{width:100%;border:1px solid #aaa;padding:3px 4px;font:inherit;border-radius:2px;background:#fff}
input.text:focus,input[type=number]:focus{outline:1px solid #555}
.small{font-size:10px;color:#666;margin-top:2px}
.status-cell{text-align:center;padding:2px!important}
.status-box{
  width:19px;height:19px;margin:auto;display:block;accent-color:#222;
  cursor:default;
}
.status-box.editable{cursor:pointer}
.status-box.auto{cursor:not-allowed}
.del{border:1px solid #b40000;background:#fff;color:#b40000;padding:2px 4px;border-radius:2px;cursor:pointer;font:inherit;margin-top:3px}
.empty{text-align:center;color:#777;padding:16px}
.status{font-size:11px;color:#666;margin-top:4px;min-height:14px}
.status.ok{color:#18733a}.status.err{color:#a00000}
.hidden{display:none!important}
.legend{font-size:10px;color:#666;margin:4px 0 0 1px}
@media(max-width:780px){
  th:nth-child(2){width:24%}th:nth-child(3){width:14%}th:nth-child(4){width:12%}
  th.status-head{width:8%}
  .wrap{padding:0 3px}
  table{min-width:820px}
  .wrap{overflow-x:auto}
}
.login-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:9999}
.login-mask.off{display:none}
.login-box{width:320px;background:#fff;border:1px solid #888;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:16px}
.login-title{font-weight:700;font-size:16px;padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid #bbb}
.login-input{width:100%;box-sizing:border-box;border:1px solid #999;padding:7px;font:inherit}
.login-buttons{text-align:right;margin-top:12px}
.login-buttons button{margin-left:5px;padding:5px 10px;border:1px solid #888;background:#f4f4f4;cursor:pointer}
.login-buttons .login-ok{background:#333;color:#fff;border-color:#333}
.login-error{color:#b00000;font-size:11px;min-height:15px;margin-top:6px}
</style>
</head>
<body>
<div id="login-mask" class="login-mask off">
  <div class="login-box">
    <div class="login-title">國有土地管理局登入驗證</div>
    <input id="login-input" class="login-input" type="password" autocomplete="off" placeholder="請輸入管理密碼">
    <div id="login-error" class="login-error"></div>
    <div class="login-buttons">
      <button id="login-cancel" type="button">取消</button>
      <button id="login-ok" class="login-ok" type="button">登入</button>
    </div>
  </div>
</div>
<div class="wrap">
  <div class="top">
    <div class="title">國民大街住戶列表 <span id="db-light" class="db-light" title="資料庫連線正常" aria-label="資料庫連線正常"></span></div>
    <button id="lock" class="lock" title="編輯">🔒</button>
  </div>

  <div id="tools" class="tools hidden">
    <button id="add" class="tool">新增住宅</button>
    <button id="save" class="tool">儲存</button>
    <button id="cancel" class="tool">取消</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>住宅名稱</th>
        <th>住宅地址</th>
        <th>戶籍登記人</th>
        <th>持戶年度</th>
        <th class="status-head">年度租金</th>
        <th class="status-head">次年補繳</th>
        <th class="status-head">住戶查封</th>
        <th class="status-head">國有收回</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="8" class="empty">正在讀取……</td></tr>
    </tbody>
  </table>


</div>

<script>
(function(){
  const API="https://wme-list.vercel.app/api/households";
  const EDIT_PASSWORD="6666";
  const YEAR_NOW=new Date().getFullYear();

  const rows=document.getElementById("rows");
  const dbLight=document.getElementById("db-light");
  const loginMask=document.getElementById("login-mask");
  const loginInput=document.getElementById("login-input");
  const loginError=document.getElementById("login-error");
  const loginOk=document.getElementById("login-ok");
  const loginCancel=document.getElementById("login-cancel");
  const lock=document.getElementById("lock");
  const tools=document.getElementById("tools");
  const add=document.getElementById("add");
  const save=document.getElementById("save");
  const cancel=document.getElementById("cancel");

  let data={version:2,updatedAt:"",households:[]};
  let backup=null;
  let editing=false;

  function statusText(t,c){
    if(!dbLight)return;
    const offline=(c==="err");
    dbLight.classList.toggle("offline",offline);
    dbLight.title=offline?"資料庫讀取失敗":"資料庫連線正常";
    dbLight.setAttribute("aria-label",offline?"資料庫讀取失敗":"資料庫連線正常");
  }

  function esc(v){
    return String(v??"").replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function holdingText(v){
    const y=parseInt(v,10);
    if(!Number.isFinite(y)) return v?String(v):"";
    return y+"（"+Math.max(0,YEAR_NOW-y)+"年）";
  }

  function normalizeHousehold(h){
    if(!h.rentPaidYear && h.rentPaidYear !== 0) h.rentPaidYear="";
    if(!h.rentMissedSince && h.rentMissedSince !== 0){
      h.rentMissedSince = h.rentPaidYear !== "" ? Number(h.rentPaidYear)+1 : YEAR_NOW;
    }
    if(h.rentPaidYear === YEAR_NOW) h.rentMissedSince="";
    return h;
  }

  function statusState(h){
    normalizeHousehold(h);
    const paidYear=parseInt(h.rentPaidYear,10);
    const missedSince=parseInt(h.rentMissedSince,10);

    const annual=(Number.isFinite(paidYear) && paidYear===YEAR_NOW);
    let overdue=0;
    if(Number.isFinite(missedSince)){
      overdue=Math.max(0,YEAR_NOW-missedSince);
    }

    return {
      annual,
      unpaid: overdue>=1,
      sealed: overdue>=2,
      reclaimed: overdue>=3
    };
  }

  function box(checked, editable, i){
    return '<input type="checkbox" class="status-box '+(editable?"editable":"auto")+'" '+(checked?"checked":"")+
      (editable?' data-rent="'+i+'"':' disabled')+' aria-label="狀態">';
  }

  function render(){
    if(!data.households.length){
      rows.innerHTML='<tr><td colspan="8" class="empty">目前沒有登錄住戶。</td></tr>';
      return;
    }

    if(!editing){
      rows.innerHTML=data.households.map(function(h){
        const s=statusState(h);
        return '<tr>'+
          '<td class="name">'+esc(h.name||"")+'</td>'+
          '<td>'+esc(h.address||"")+'</td>'+
          '<td>'+esc(h.registrant||"")+'</td>'+
          '<td class="year">'+esc(holdingText(h.year))+'</td>'+
          '<td class="status-cell">'+box(s.annual,false)+'</td>'+
          '<td class="status-cell">'+box(s.unpaid,false)+'</td>'+
          '<td class="status-cell">'+box(s.sealed,false)+'</td>'+
          '<td class="status-cell">'+box(s.reclaimed,false)+'</td>'+
          '</tr>';
      }).join("");
      return;
    }

    rows.innerHTML=data.households.map(function(h,i){
      const s=statusState(h);
      return '<tr class="editing">'+
        '<td><input class="text" data-i="'+i+'" data-k="name" value="'+esc(h.name||"")+'"></td>'+
        '<td><input class="text" data-i="'+i+'" data-k="address" value="'+esc(h.address||"")+'"></td>'+
        '<td><input class="text" data-i="'+i+'" data-k="registrant" value="'+esc(h.registrant||"")+'"></td>'+
        '<td class="year">'+
          '<input type="number" min="0" step="1" data-i="'+i+'" data-k="year" value="'+esc(h.year||"")+'">'+
          '<div class="small">目前 '+YEAR_NOW+' 年：'+esc(holdingText(h.year))+'</div>'+
          '<button type="button" class="del" data-del="'+i+'">刪除</button>'+
        '</td>'+
        '<td class="status-cell">'+box(s.annual,true,i)+'</td>'+
        '<td class="status-cell">'+box(s.unpaid,false)+'</td>'+
        '<td class="status-cell">'+box(s.sealed,false)+'</td>'+
        '<td class="status-cell">'+box(s.reclaimed,false)+'</td>'+
        '</tr>';
    }).join("");
  }

  rows.addEventListener("input",function(e){
    const el=e.target;
    if(!el.matches("input[data-i]"))return;
    const i=Number(el.dataset.i);
    data.households[i][el.dataset.k]=el.value;
    if(el.dataset.k==="year"){
      const note=el.parentElement.querySelector(".small");
      if(note)note.textContent="目前 "+YEAR_NOW+" 年："+holdingText(el.value);
    }
  });

  rows.addEventListener("change",function(e){
    const rent=e.target.closest("[data-rent]");
    if(!rent || !editing)return;

    const i=Number(rent.dataset.rent);
    const h=data.households[i];

    if(rent.checked){
      h.rentPaidYear=YEAR_NOW;
      h.rentMissedSince="";
    }else{
      h.rentPaidYear=YEAR_NOW-1;
      h.rentMissedSince=YEAR_NOW;
    }
    render();
  });

  rows.addEventListener("click",function(e){
    const btn=e.target.closest("[data-del]");
    if(!btn || !editing)return;
    const i=Number(btn.dataset.del);
    if(confirm("確定刪除此住宅？")){
      data.households.splice(i,1);
      render();
    }
  });

  function openLogin(){
    loginMask.classList.remove("off");
    loginInput.value="";
    loginError.textContent="";
    setTimeout(function(){loginInput.focus();},0);
  }

  function closeLogin(){
    loginMask.classList.add("off");
    loginInput.value="";
    loginError.textContent="";
  }

  function enterEdit(){
    backup=JSON.parse(JSON.stringify(data));
    editing=true;
    lock.textContent="🔓";
    tools.classList.remove("hidden");
    render();
    statusText("", "ok");
  }

  function exitEdit(){
    editing=false;
    lock.textContent="🔒";
    tools.classList.add("hidden");
    render();
  }

  loginOk.onclick=function(){
    if(loginInput.value!==EDIT_PASSWORD){
      loginError.textContent="密碼錯誤";
      loginInput.focus();
      return;
    }
    closeLogin();
    enterEdit();
  };

  loginCancel.onclick=closeLogin;

  loginInput.addEventListener("keydown",function(e){
    if(e.key==="Enter")loginOk.click();
    if(e.key==="Escape")closeLogin();
  });

  lock.onclick=function(){
    if(editing){
      exitEdit();
      statusText("", "ok");
    }else{
      openLogin();
    }
  };

  cancel.onclick=function(){
    if(backup)data=JSON.parse(JSON.stringify(backup));
    exitEdit();
    statusText("", "ok");
  };

  add.onclick=function(){
    data.households.push({
      id:Date.now(),
      name:"",
      address:"",
      registrant:"",
      year:"",
      rentPaidYear: YEAR_NOW-1,
      rentMissedSince: YEAR_NOW
    });
    render();
    const inputs=rows.querySelectorAll("input.text,input[type=number]");
    if(inputs.length)inputs[0].focus();
  };

  save.onclick=async function(){
    save.disabled=true;
    statusText("", "ok");
    try{
      const r=await fetch(API,{
        method:"PUT",
        headers:{
          "Content-Type":"application/json",
          "X-Edit-Password":EDIT_PASSWORD
        },
        body:JSON.stringify(data)
      });
      const out=await r.json();
      if(!r.ok)throw new Error(out.error||("HTTP "+r.status));
      data=out;
      exitEdit();
      statusText("", "ok");
    }catch(e){
      statusText("", "err");
    }finally{
      save.disabled=false;
    }
  };

  async function load(){
    statusText("", "ok");
    try{
      const r=await fetch(API,{cache:"no-store"});
      if(!r.ok)throw new Error("HTTP "+r.status);
      const out=await r.json();
      data=out&&Array.isArray(out.households)?out:{version:2,households:[]};
      data.households.forEach(normalizeHousehold);
      render();
      statusText("", "ok");
    }catch(e){
      rows.innerHTML='<tr><td colspan="8" class="empty">讀取失敗：'+esc(e.message)+'</td></tr>';
      statusText("", "err");
    }
  }

  load();
})();
</script>
</body>
</html>
