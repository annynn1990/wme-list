<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>國民大街住戶列表</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#fff;color:#222;font-family:Arial,"Microsoft JhengHei",sans-serif;font-size:14px}
.wrap{max-width:980px;margin:10px auto;padding:0 8px}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;padding:3px 0 6px}
.title{font-size:18px;font-weight:700}
.lock{border:0;background:#d60000;color:#fff;width:32px;height:30px;border-radius:4px;font-size:17px;cursor:pointer;line-height:30px;padding:0}
.lock:hover{background:#b00000}
.tools{display:flex;gap:4px;margin:5px 0;flex-wrap:wrap}
button.tool{border:1px solid #999;background:#f5f5f5;color:#222;padding:3px 7px;border-radius:3px;font:inherit;cursor:pointer}
button.tool:hover{background:#e9e9e9}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{border:1px solid #999;padding:4px 6px;line-height:1.25;vertical-align:middle}
th{font-weight:700;background:#eee;text-align:center}
th:nth-child(1){width:24%}
th:nth-child(2){width:34%}
th:nth-child(3){width:20%}
th:nth-child(4){width:22%}
.name{font-weight:700}
.year{white-space:nowrap;text-align:center}
.editing td{background:#fffef2}
input{width:100%;border:1px solid #aaa;padding:3px 4px;font:inherit;border-radius:2px;background:#fff}
input:focus{outline:1px solid #555}
.small{font-size:11px;color:#666;margin-top:2px}
.del{border:1px solid #b40000;background:#fff;color:#b40000;padding:2px 5px;border-radius:2px;cursor:pointer;font:inherit;margin-top:3px}
.del:hover{background:#ffe8e8}
.empty{text-align:center;color:#777;padding:18px}
.status{font-size:12px;color:#666;margin-top:5px;min-height:16px}
.status.ok{color:#18733a}
.status.err{color:#a00000}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title">國民大街住戶列表</div>
    <button id="lock" class="lock" title="編輯">🔒</button>
  </div>

  <div id="tools" class="tools hidden">
    <button id="add" class="tool">新增住宅</button>
    <button id="save" class="tool">儲存</button>
    <button id="cancel" class="tool">取消</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>住宅名稱</th>
        <th>住宅地址</th>
        <th>戶籍登記人</th>
        <th>持戶年度</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="4" class="empty">正在讀取……</td></tr>
    </tbody>
  </table>

  <div id="status" class="status"></div>
</div>

<script>
(function(){
  const API="https://wme-list.vercel.app/api/households";
  const EDIT_PASSWORD="6666";
  const YEAR_NOW=new Date().getFullYear();

  const rows=document.getElementById("rows");
  const status=document.getElementById("status");
  const lock=document.getElementById("lock");
  const tools=document.getElementById("tools");
  const add=document.getElementById("add");
  const save=document.getElementById("save");
  const cancel=document.getElementById("cancel");

  let data={version:1,updatedAt:"",households:[]};
  let backup=null;
  let editing=false;

  function statusText(t,c){
    status.textContent=t||"";
    status.className="status "+(c||"");
  }

  function esc(v){
    return String(v??"").replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function yearText(v){
    const y=parseInt(v,10);
    if(!Number.isFinite(y)) return v?String(v):"";
    return y+"（"+Math.max(0,YEAR_NOW-y)+"年）";
  }

  function render(){
    if(!data.households.length){
      rows.innerHTML='<tr><td colspan="4" class="empty">目前沒有登錄住戶。</td></tr>';
      return;
    }

    if(!editing){
      rows.innerHTML=data.households.map(function(h){
        return '<tr>'+
          '<td class="name">'+esc(h.name||"")+'</td>'+
          '<td>'+esc(h.address||"")+'</td>'+
          '<td>'+esc(h.registrant||"")+'</td>'+
          '<td class="year">'+esc(yearText(h.year))+'</td>'+
          '</tr>';
      }).join("");
      return;
    }

    rows.innerHTML=data.households.map(function(h,i){
      return '<tr class="editing">'+
        '<td><input data-i="'+i+'" data-k="name" value="'+esc(h.name||"")+'"></td>'+
        '<td><input data-i="'+i+'" data-k="address" value="'+esc(h.address||"")+'"></td>'+
        '<td><input data-i="'+i+'" data-k="registrant" value="'+esc(h.registrant||"")+'"></td>'+
        '<td class="year">'+
          '<input type="number" min="0" step="1" data-i="'+i+'" data-k="year" value="'+esc(h.year||"")+'">'+
          '<div class="small">目前 '+YEAR_NOW+' 年：'+esc(yearText(h.year))+'</div>'+
          '<button type="button" class="del" data-del="'+i+'">刪除</button>'+
        '</td>'+
        '</tr>';
    }).join("");
  }

  rows.addEventListener("input",function(e){
    const el=e.target;
    if(!el.matches("input[data-i]"))return;
    const i=Number(el.dataset.i);
    data.households[i][el.dataset.k]=el.value;
    if(el.dataset.k==="year"){
      const note=el.parentElement.querySelector(".small");
      if(note)note.textContent="目前 "+YEAR_NOW+" 年："+yearText(el.value);
    }
  });

  rows.addEventListener("click",function(e){
    const btn=e.target.closest("[data-del]");
    if(!btn || !editing)return;
    const i=Number(btn.dataset.del);
    if(confirm("確定刪除此住宅？")){
      data.households.splice(i,1);
      render();
    }
  });

  function enterEdit(){
    const pw=prompt("請輸入編輯密碼：");
    if(pw!==EDIT_PASSWORD){
      alert("密碼錯誤");
      return;
    }
    backup=JSON.parse(JSON.stringify(data));
    editing=true;
    lock.textContent="🔓";
    tools.classList.remove("hidden");
    render();
    statusText("編輯模式","ok");
  }

  function exitEdit(){
    editing=false;
    lock.textContent="🔒";
    tools.classList.add("hidden");
    render();
  }

  lock.onclick=function(){
    if(editing){
      exitEdit();
      statusText("已鎖定");
    }else{
      enterEdit();
    }
  };

  cancel.onclick=function(){
    if(backup)data=JSON.parse(JSON.stringify(backup));
    exitEdit();
    statusText("已取消修改");
  };

  add.onclick=function(){
    data.households.push({id:Date.now(),name:"",address:"",registrant:"",year:""});
    render();
    const inputs=rows.querySelectorAll("input");
    if(inputs.length)inputs[inputs.length-4].focus();
  };

  save.onclick=async function(){
    save.disabled=true;
    statusText("正在儲存……");
    try{
      const r=await fetch(API,{
        method:"PUT",
        headers:{
          "Content-Type":"application/json",
          "X-Edit-Password":EDIT_PASSWORD
        },
        body:JSON.stringify(data)
      });
      const out=await r.json();
      if(!r.ok)throw new Error(out.error||("HTTP "+r.status));
      data=out;
      exitEdit();
      statusText("已儲存","ok");
    }catch(e){
      statusText("儲存失敗："+e.message,"err");
    }finally{
      save.disabled=false;
    }
  };

  async function load(){
    statusText("正在讀取……");
    try{
      const r=await fetch(API,{cache:"no-store"});
      if(!r.ok)throw new Error("HTTP "+r.status);
      const out=await r.json();
      data=out&&Array.isArray(out.households)?out:{version:1,households:[]};
      render();
      statusText("共 "+data.households.length+" 戶");
    }catch(e){
      rows.innerHTML='<tr><td colspan="4" class="empty">讀取失敗：'+esc(e.message)+'</td></tr>';
      statusText(e.message,"err");
    }
  }

  load();
})();
</script>
</body>
</html>
